<style>
    .btn-xs { padding: 4px 10px; font-size: 0.76rem; font-weight: 700; border-radius: 7px; }
    .maintenance-modal {
        width: min(1020px, calc(100vw - 24px));
        max-width: 1020px;
        border-radius: 16px;
        border: none;
        box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.35);
        overflow: hidden;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        max-height: 92vh;
    }
    .maintenance-form-header {
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        color: #ffffff;
        padding: 16px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
    }
    .maintenance-form-header h2 { margin: 0; font-size: 1.2rem; font-weight: 800; color: #ffffff; display: flex; align-items: center; gap: 10px; }
    .maintenance-form-header p { margin: 3px 0 0; font-size: 0.82rem; color: #94a3b8; font-weight: 500; }
    .maintenance-form-body { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
    .maintenance-form-grid {
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        gap: 16px;
        padding: 18px 24px;
        overflow-y: auto;
        flex: 1;
        align-items: stretch;
    }
    .maintenance-card {
        background: #ffffff;
        border: 1.5px solid #cbd5e1;
        border-radius: 12px;
        padding: 16px 18px;
        display: flex;
        flex-direction: column;
    }
    .maintenance-card.full { grid-column: 1 / -1; }
    .maintenance-card-title {
        font-size: 0.84rem;
        font-weight: 800;
        color: #0f172a;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 12px;
        padding-bottom: 8px;
        border-bottom: 1.5px solid #e2e8f0;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .maintenance-card-title .section-icon { color: var(--brand-primary, #f44905); }
    .maintenance-fields-2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        align-items: end;
    }
    .maintenance-fields-3 {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-top: 12px;
        align-items: end;
    }
    .maintenance-card .form-field { margin-bottom: 11px; min-width: 0; }
    .maintenance-card .form-field:last-child { margin-bottom: 0; }
    .maintenance-card label {
        display: block;
        font-size: 0.8rem;
        font-weight: 700;
        color: #334155;
        margin-bottom: 5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .maintenance-card input[type="text"],
    .maintenance-card input[type="number"],
    .maintenance-card input[type="date"],
    .maintenance-card select,
    .maintenance-card textarea {
        width: 100%;
        height: 38px;
        border: 1.5px solid #cbd5e1;
        border-radius: 9px;
        padding: 6px 11px;
        font-size: 0.86rem;
        font-weight: 600;
        color: #0f172a;
        background-color: #ffffff;
        box-sizing: border-box;
    }
    .maintenance-card textarea {
        height: 76px;
        resize: vertical;
        line-height: 1.45;
    }
    .maintenance-card input[readonly] {
        background-color: #f8fafc;
        color: #475569;
        font-weight: 700;
    }
    .maintenance-checklist {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 9px 14px;
        background: #f8fafc;
        border: 1.5px solid #cbd5e1;
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 12px;
    }
    .maintenance-checklist label {
        font-size: 0.84rem;
        font-weight: 600;
        color: #334155;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin: 0 !important;
        white-space: nowrap;
    }
    .maintenance-photo-tabs { display: flex; gap: 4px; background: #f1f5f9; padding: 4px; border-radius: 9px; margin-bottom: 10px; }
    .maintenance-photo-stage { flex: 1; border: none; background: transparent; padding: 6px 10px; border-radius: 7px; font-size: 0.8rem; font-weight: 700; color: #475569; cursor: pointer; transition: all 0.15s; }
    .maintenance-photo-stage.active { background: #ffffff; color: var(--brand-primary, #f44905); box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .maintenance-photo-actions { display: flex; gap: 8px; margin-bottom: 10px; }
    .maintenance-photo-preview { flex: 1; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 10px; min-height: 92px; background: #f8fafc; border: 1.5px dashed #cbd5e1; border-radius: 10px; padding: 10px; }
    .maintenance-photo-item { width: 68px; height: 68px; border-radius: 8px; overflow: hidden; position: relative; border: 1.5px solid #cbd5e1; background: #ffffff; }
    .maintenance-photo-item img { width: 100%; height: 100%; object-fit: cover; }
    .maintenance-photo-item button { position: absolute; top: 2px; right: 2px; background: rgba(239,68,68,0.92); color: #fff; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 11px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .maintenance-cost-total { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #fffaf5; border: 1.5px solid #fed7aa; border-radius: 9px; margin-top: auto; }
    .maintenance-cost-total strong { font-size: 1.08rem; color: var(--brand-primary, #f44905); }
    .maintenance-form-footer { display: flex; justify-content: flex-end; align-items: center; gap: 10px; padding: 13px 24px; background: #f8fafc; border-top: 1.5px solid #e2e8f0; flex-shrink: 0; }
    @media (max-width: 820px) {
        .maintenance-form-grid,
        .maintenance-fields-2,
        .maintenance-fields-3 {
            grid-template-columns: 1fr;
        }
        .maintenance-checklist {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
    }
</style>

<!-- MODAL PHIẾU BẢO DƯỠNG -->
<div id="maintenanceModal" class="modalback-pro" onclick="if(event.target === this) closeModal('maintenanceModal')">
  <div class="modal-content-box maintenance-modal">
    <div class="maintenance-form-header">
      <div>
        <h2><i class="fa-solid fa-wrench text-warning"></i> Phiếu bảo dưỡng kỹ thuật</h2>
      </div>
      <button type="button" onclick="closeModal('maintenanceModal')" class="vm-modal-close" aria-label="Đóng">&times;</button>
    </div>

    <form method="POST" enctype="multipart/form-data" id="maintenanceForm" class="maintenance-form-body">
      {% csrf_token %}
      <input type="hidden" name="action" value="add_maintenance">
      <input type="hidden" name="giai_doan_anh" id="maintenancePhotoStage" value="TRUOC">

      <div class="maintenance-form-grid">
        <!-- KHỐI 1: THÔNG TIN PHIẾU -->
        <section class="maintenance-card">
          <div class="maintenance-card-title"><i class="fa-solid fa-circle-info section-icon"></i> Thông tin phiếu</div>
          <div class="maintenance-fields-2">
            <div class="form-field">
              <label>Mã phiếu bảo dưỡng *</label>
              <input type="text" name="ma_phieu_bao_duong" class="font-monospace" value="{{ next_ma_phieu_bd }}" data-default-code="{{ next_ma_phieu_bd }}" readonly required>
            </div>
            <div class="form-field">
              <label>Biển số xe *</label>
              <input type="text" id="maint_bien_so" name="bien_so_xe" class="font-monospace" readonly required>
            </div>
            <div class="form-field mb-0">
              <label>Kỹ thuật viên phụ trách *</label>
              <select name="ma_nhan_vien" class="form-select" required>
                <option value="">Chọn kỹ thuật viên</option>
                {% for nv in nhan_viens %}
                  <option value="{{ nv.ma_nhan_vien }}">{{ nv.ho_ten }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="form-field mb-0">
              <label>Loại bảo dưỡng *</label>
              <select name="loai_bao_duong" class="form-select" required>
                <option value="DINH_KY">Bảo dưỡng định kỳ</option>
                <option value="SUA_CHUA">Sửa chữa phát sinh</option>
                <option value="KIEM_TRA">Kiểm tra an toàn kỹ thuật</option>
              </select>
            </div>
          </div>
          <div class="maintenance-fields-3">
            <div class="form-field mb-0">
              <label>Ngày tiếp nhận *</label>
              <input type="date" id="maint_ngay_bao_duong" name="ngay_bao_duong" class="font-monospace" value="{{ today|date:'Y-m-d' }}" data-today="{{ today|date:'Y-m-d' }}" required>
            </div>
            <div class="form-field mb-0">
              <label>ODO tiếp nhận (km) *</label>
              <input type="number" id="maint_odo" name="odo_luc_bao_duong" class="font-monospace" min="0" step="1" readonly required>
            </div>
            <div class="form-field mb-0">
              <label>Mức độ ưu tiên</label>
              <select name="muc_do_uu_tien" class="form-select">
                <option value="BINH_THUONG">Bình thường</option>
                <option value="THAP">Thấp</option>
                <option value="CAO">Cao</option>
                <option value="KHAN_CAP">Khẩn cấp</option>
              </select>
            </div>
          </div>
        </section>

        <!-- KHỐI 2: HÌNH ẢNH HẠNG MỤC -->
        <section class="maintenance-card">
          <div class="maintenance-card-title"><i class="fa-solid fa-camera section-icon"></i> Hình ảnh hiện trạng xe</div>
          <div class="maintenance-photo-tabs" role="group">
            <button type="button" class="maintenance-photo-stage active" data-stage="TRUOC">Trước BD</button>
            <button type="button" class="maintenance-photo-stage" data-stage="TRONG">Trong BD</button>
            <button type="button" class="maintenance-photo-stage" data-stage="SAU">Sau BD</button>
          </div>
          <div class="maintenance-photo-actions">
            <button type="button" class="btn btn-outline-secondary btn-sm fw-bold d-inline-flex align-items-center gap-1" style="border-radius: 8px; height: 34px;" onclick="document.getElementById('maintenanceCameraInput').click()">
              <i class="fa-solid fa-camera"></i> <span>Chụp ảnh</span>
            </button>
            <button type="button" class="btn btn-outline-secondary btn-sm fw-bold d-inline-flex align-items-center gap-1" style="border-radius: 8px; height: 34px;" onclick="document.getElementById('maintenanceGalleryInput').click()">
              <i class="fa-solid fa-upload"></i> <span>Tải ảnh lên</span>
            </button>
            <input type="file" id="maintenanceCameraInput" accept="image/*" capture="environment" multiple hidden>
            <input type="file" id="maintenanceGalleryInput" accept="image/*" multiple hidden>
          </div>
          <div id="maintenancePhotoPreview" class="maintenance-photo-preview"></div>
          <div style="font-size: 0.75rem; color: #64748b; margin-top: 6px;">Click vào ảnh để phóng to. Tối đa 8 MB/ảnh.</div>
        </section>

        <!-- KHỐI 3: KIỂM TRA & XỬ LÝ -->
        <section class="maintenance-card full">
          <div class="maintenance-card-title"><i class="fa-solid fa-screwdriver-wrench section-icon"></i> Kiểm tra và xử lý kỹ thuật</div>
          <div class="form-field">
            <label>Hạng mục kiểm tra</label>
            <div class="maintenance-checklist">
              <label data-engine="XANG"><input type="checkbox" name="hang_muc_kiem_tra" value="Thay nhớt"> Thay nhớt</label>
              <label><input type="checkbox" name="hang_muc_kiem_tra" value="Kiểm tra phanh"> Kiểm tra phanh</label>
              <label data-engine="XANG"><input type="checkbox" name="hang_muc_kiem_tra" value="Vệ sinh lọc gió"> Vệ sinh lọc gió</label>
              <label data-engine="DIEN"><input type="checkbox" name="hang_muc_kiem_tra" value="Kiểm tra pin & sạc"> Kiểm tra pin & sạc</label>
              <label data-engine="DIEN"><input type="checkbox" name="hang_muc_kiem_tra" value="Kiểm tra bộ điều tốc IC"> Kiểm tra bộ điều tốc IC</label>
              <label data-engine="DIEN"><input type="checkbox" name="hang_muc_kiem_tra" value="Kiểm tra động cơ điện"> Kiểm tra động cơ điện</label>
              <label><input type="checkbox" name="hang_muc_kiem_tra" value="Kiểm tra lốp"> Kiểm tra lốp</label>
              <label><input type="checkbox" name="hang_muc_kiem_tra" value="Kiểm tra đèn"> Kiểm tra đèn</label>
              <label data-engine="XANG"><input type="checkbox" name="hang_muc_kiem_tra" value="Kiểm tra ắc quy"> Kiểm tra ắc quy</label>
              <label><input type="checkbox" name="hang_muc_kiem_tra" value="Kiểm tra truyền động"> Kiểm tra truyền động</label>
            </div>
          </div>
          <div class="maintenance-fields-3 mt-0">
            <div class="form-field mb-0">
              <label>Tình trạng phát hiện *</label>
              <textarea name="tinh_trang_phat_hien" placeholder="Mô tả tình trạng hư hỏng lúc tiếp nhận..." required></textarea>
            </div>
            <div class="form-field mb-0">
              <label id="lblMaintRepairContent">Nội dung sửa chữa / thay thế</label>
              <textarea name="noi_dung_sua_chua" id="maintRepairContent" placeholder="Chi tiết phụ tùng thay thế, công việc xử lý..."></textarea>
            </div>
            <div class="form-field mb-0">
              <label>Kết quả xử lý & Bàn giao</label>
              <textarea name="ket_qua_xu_ly" placeholder="Ghi nhận kết quả chạy thử, nghiệm thu an toàn..."></textarea>
            </div>
          </div>
        </section>

        <!-- KHỐI 4: CHI PHÍ BẢO DƯỠNG -->
        <section class="maintenance-card">
          <div class="maintenance-card-title"><i class="fa-solid fa-receipt section-icon"></i> Chi phí bảo dưỡng</div>
          <div class="mb-2">
            <small class="text-secondary fw-bold d-block mb-1" style="font-size: 0.76rem;">Thêm nhanh chi phí phụ tùng:</small>
            <div class="d-flex flex-wrap gap-1.5">
              <button type="button" data-engine="XANG" class="btn btn-xs btn-outline-secondary fw-bold" onclick="addMaintCostParts(120000)">+ Nhớt (120k)</button>
              <button type="button" class="btn btn-xs btn-outline-secondary fw-bold" onclick="addMaintCostParts(150000)">+ Phanh (150k)</button>
              <button type="button" class="btn btn-xs btn-outline-secondary fw-bold" onclick="addMaintCostParts(250000)">+ Lốp (250k)</button>
              <button type="button" class="btn btn-xs btn-outline-danger fw-bold" onclick="document.getElementById('maintCostParts').value=0; updateMaintenanceCostDisplay();">Đặt lại</button>
            </div>
          </div>
          <div class="maintenance-fields-2 mb-3">
            <div class="form-field mb-0">
              <label>Chi phí phụ tùng (VNĐ)</label>
              <input type="number" name="chi_phi_phu_tung" id="maintCostParts" class="font-monospace" min="0" step="1000" value="0">
            </div>
            <div class="form-field mb-0">
              <label>Nhân công / Chi phí khác (VNĐ)</label>
              <input type="number" name="chi_phi_khac" id="maintCostOther" class="font-monospace" min="0" step="1000" value="0">
            </div>
          </div>
          <div class="maintenance-cost-total">
            <span class="fw-bold text-dark small">Tổng chi phí quyết toán:</span>
            <strong id="maintCostTotal" class="font-monospace">0 đ</strong>
          </div>
        </section>

        <!-- KHỐI 5: TRẠNG THÁI XỬ LÝ -->
        <section class="maintenance-card">
          <div class="maintenance-card-title"><i class="fa-solid fa-list-check section-icon"></i> Trạng thái xử lý</div>
          <div class="form-field">
            <label>Trạng thái phiếu *</label>
            <select name="trang_thai_bd" id="maintenanceStatus" class="form-select" required>
              <option value="DANG_XU_LY">Đang xử lý tại xưởng</option>
              <option value="HOAN_THANH">Hoàn thành & Xuất xưởng</option>
            </select>
          </div>
          <div id="maintenanceCompletionFields" hidden>
            <div class="maintenance-fields-2">
              <div class="form-field mb-0">
                <label>Ngày hoàn thành *</label>
                <input type="date" name="ngay_hoan_thanh" id="maintenanceCompletionDate" class="font-monospace" data-today="{{ today|date:'Y-m-d' }}">
              </div>
              <div class="form-field mb-0">
                <label>Trạng thái xe xuất xưởng</label>
                <select name="trang_thai_sau_bd" id="maintenanceAfterStatus" class="form-select">
                  <option value="CON_TRONG">Còn trống (Sẵn sàng)</option>
                  <option value="CHO_VE_SINH">Chờ rửa xe / Sạc pin</option>
                </select>
              </div>
            </div>
          </div>
        </section>
      </div>

      <div class="maintenance-form-footer">
        <button type="submit" id="maintenanceSaveButton" class="btn-brand shadow-sm px-4 fw-bold" style="height: 38px;">
          <i class="fa-solid fa-floppy-disk me-1"></i> Lưu phiếu
        </button>
      </div>
    </form>
  </div>
</div>

<!-- MODAL LIGHTBOX PHÓNG TO ẢNH -->
<div id="imageZoomModal" class="modalback-pro" onclick="closeModal('imageZoomModal')" style="z-index: 1080;">
    <div style="max-width:90vw; max-height:90vh; position:relative;">
        <img id="zoomedImage" src="" alt="Ảnh bảo dưỡng chi tiết" style="max-width:100%; max-height:85vh; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,0.5); object-fit:contain;">
        <p class="text-white text-center mt-2 fw-bold" id="zoomedImageCaption"></p>
    </div>
</div>

<script>
// Dùng var để không bao giờ bị lỗi redeclaration khi HTMX boost chuyển trang qua lại
var maintenanceCurrentStage = 'TRUOC';
var maintenanceNewImages = [];
var maintenanceSavedImages = [];

function applyMaintenanceEngine(engine) {
    document.querySelectorAll('.maintenance-checklist label[data-engine]').forEach(label => {
        const allowed = label.dataset.engine === engine;
        label.hidden = !allowed;
        if (!allowed) label.querySelector('input').checked = false;
    });
    // Ẩn nút thêm nhanh nhớt nếu là xe điện
    document.querySelectorAll('#maintenanceModal button[data-engine]').forEach(btn => {
        btn.hidden = btn.dataset.engine !== engine;
    });
}

function syncMaintDateInput(el, dateStr) {
    if (!el) return;
    el.value = dateStr || '';
    if (el._flatpickr) {
        el._flatpickr.setDate(dateStr || '', false);
    }
}

function clearMaintenanceImages() {
    maintenanceNewImages.forEach(item => URL.revokeObjectURL(item.url));
    maintenanceNewImages = [];
    maintenanceSavedImages = [];
    const preview = document.getElementById('maintenancePhotoPreview');
    if (preview) preview.replaceChildren();
}

function setMaintenancePhotoStage(stage) {
    maintenanceCurrentStage = stage;
    const stageInput = document.getElementById('maintenancePhotoStage');
    if (stageInput) stageInput.value = stage;
    document.querySelectorAll('.maintenance-photo-stage').forEach(btn => btn.classList.toggle('active', btn.dataset.stage === stage));
    renderMaintenanceImagePreview();
}

function addMaintenanceImages(files) {
    for (const file of Array.from(files || [])) {
        if (!file.type.startsWith('image/') || file.size > 8 * 1024 * 1024) {
            alert('Chỉ nhận ảnh tối đa 8 MB/tệp.');
            continue;
        }
        maintenanceNewImages.push({ file, stage: maintenanceCurrentStage, url: URL.createObjectURL(file) });
    }
    renderMaintenanceImagePreview();
}

function renderMaintenanceImagePreview() {
    const preview = document.getElementById('maintenancePhotoPreview');
    if (!preview) return;
    preview.replaceChildren();
    const all = [
        ...maintenanceSavedImages.map(item => ({ ...item, saved: true })),
        ...maintenanceNewImages.map(item => ({ ...item, saved: false }))
    ];
    const filtered = all.filter(item => item.stage === maintenanceCurrentStage);
    if (filtered.length === 0) {
        const emptyHint = document.createElement('div');
        emptyHint.className = 'w-100 text-center text-secondary small my-auto fw-medium';
        emptyHint.textContent = 'Chưa có hình ảnh cho giai đoạn này';
        preview.appendChild(emptyHint);
        return;
    }

    filtered.forEach(item => {
        const div = document.createElement('div');
        div.className = 'maintenance-photo-item';
        div.style.cursor = 'pointer';

        const img = document.createElement('img');
        img.src = item.url;
        img.loading = 'lazy';
        img.alt = 'Ảnh bảo dưỡng';
        img.title = 'Click để phóng to ảnh';
        img.onclick = () => openImageZoom(item.url, 'Ảnh giai đoạn: ' + item.stage);

        div.appendChild(img);
        if (!item.saved && !document.getElementById('maintenanceSaveButton').hidden) {
            const remove = document.createElement('button');
            remove.type = 'button';
            remove.textContent = '×';
            remove.onclick = (e) => {
                e.stopPropagation();
                URL.revokeObjectURL(item.url);
                maintenanceNewImages = maintenanceNewImages.filter(i => i !== item);
                renderMaintenanceImagePreview();
            };
            div.appendChild(remove);
        }
        preview.appendChild(div);
    });
}

function openImageZoom(url, caption) {
    const zoomModal = document.getElementById('imageZoomModal');
    if (zoomModal) {
        document.getElementById('zoomedImage').src = url;
        document.getElementById('zoomedImageCaption').textContent = caption || '';
        openModal('imageZoomModal');
    }
}

function setMaintenanceReadonly(readonly) {
    const form = document.getElementById('maintenanceForm');
    if (!form) return;
    form.querySelectorAll('input,select,textarea,button').forEach(el => {
        if (el.type !== 'hidden' && el.type !== 'button' && el.id !== 'maintenanceSaveButton') {
            el.disabled = readonly;
            if (el._flatpickr && el._flatpickr.altInput) {
                el._flatpickr.altInput.disabled = readonly;
            }
        }
    });
    document.querySelectorAll('.maintenance-photo-actions button').forEach(el => el.disabled = readonly);
    document.getElementById('maintenanceSaveButton').hidden = readonly;
}

function openMaintenanceModal(bienSo, odo, phieuId = '', engine = 'XANG') {
    const form = document.getElementById('maintenanceForm');
    if (!form) return;
    setMaintenanceReadonly(false);
    form.reset();
    clearMaintenanceImages();

    const codeInput = form.querySelector('[name="ma_phieu_bao_duong"]');
    if (codeInput && codeInput.dataset.defaultCode) {
        codeInput.value = codeInput.dataset.defaultCode;
    }

    const recvDateInput = document.getElementById('maint_ngay_bao_duong');
    if (recvDateInput) {
        syncMaintDateInput(recvDateInput, recvDateInput.dataset.today || '');
    }

    document.getElementById('maint_bien_so').value = bienSo;
    document.getElementById('maint_odo').value = odo;

    const record = phieuId ? maintenanceDetails[phieuId] : null;
    if (record) {
        Object.entries(record).forEach(([key, value]) => {
            const field = form.elements.namedItem(key);
            if (field && !['images', 'hang_muc_kiem_tra'].includes(key) && typeof value !== 'object') {
                field.value = value ?? '';
                if (field._flatpickr) syncMaintDateInput(field, value ?? '');
            }
        });
        codeInput.value = record.ma_phieu_bao_duong;
        form.querySelectorAll('[name="hang_muc_kiem_tra"]').forEach(el => {
            el.checked = (record.hang_muc_kiem_tra || []).includes(el.value);
        });
        (record.images || []).forEach(img => maintenanceSavedImages.push(img));
        form.elements.namedItem('trang_thai_bd').value = record.trang_thai;
    }

    applyMaintenanceEngine(engine);
    setMaintenancePhotoStage('TRUOC');
    renderMaintenanceImagePreview();
    document.getElementById('maintenanceSaveButton').innerHTML = record
        ? '<i class="fa-solid fa-floppy-disk me-1"></i> Cập nhật phiếu'
        : '<i class="fa-solid fa-floppy-disk me-1"></i> Lưu phiếu';
    document.getElementById('maintenanceStatus').dispatchEvent(new Event('change'));
    updateMaintenanceCostDisplay();
    openModal('maintenanceModal');
}

function openMaintenanceHistory(id) {
    const record = maintenanceDetails[id];
    if (!record) return;
    openMaintenanceModal(record.bien_so_xe, record.odo_luc_bao_duong, id, record.loai_dong_co || 'XANG');
    if (record.trang_thai === 'HOAN_THANH') {
        setMaintenanceReadonly(true);
        renderMaintenanceImagePreview();
    }
}

function addMaintCostParts(amount) {
    const input = document.getElementById('maintCostParts');
    if (!input) return;
    input.value = Number(input.value || 0) + amount;
    updateMaintenanceCostDisplay();
}

function updateMaintenanceCostDisplay() {
    const parts = Number(document.getElementById('maintCostParts')?.value || 0);
    const other = Number(document.getElementById('maintCostOther')?.value || 0);
    const totalEl = document.getElementById('maintCostTotal');
    if (totalEl) totalEl.textContent = new Intl.NumberFormat('vi-VN').format(parts + other) + ' đ';
}

function initMaintenanceFormBindings() {
    document.querySelectorAll('.maintenance-photo-stage').forEach(btn => {
        btn.onclick = () => setMaintenancePhotoStage(btn.dataset.stage);
    });
    ['maintenanceCameraInput', 'maintenanceGalleryInput'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.onchange = e => { addMaintenanceImages(e.target.files); e.target.value = ''; };
    });
    const status = document.getElementById('maintenanceStatus');
    if (status) {
        status.onchange = function() {
            const done = status.value === 'HOAN_THANH';
            const compFields = document.getElementById('maintenanceCompletionFields');
            const compDate = document.getElementById('maintenanceCompletionDate');
            const repairInput = document.getElementById('maintRepairContent');
            const repairLabel = document.getElementById('lblMaintRepairContent');

            if (compFields) compFields.hidden = !done;
            if (compDate) {
                compDate.required = done;
                if (done && !compDate.value && compDate.dataset.today) {
                    syncMaintDateInput(compDate, compDate.dataset.today);
                }
            }
            // Chỉ bắt buộc nhập Nội dung sửa chữa khi Hoàn thành & Xuất xưởng
            if (repairInput) repairInput.required = done;
            if (repairLabel) {
                repairLabel.textContent = done
                    ? 'Nội dung sửa chữa / thay thế *'
                    : 'Nội dung sửa chữa / thay thế';
            }
        };
    }
    ['maintCostParts', 'maintCostOther'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.oninput = updateMaintenanceCostDisplay;
    });
    const maintForm = document.getElementById('maintenanceForm');
    if (maintForm) {
        maintForm.onsubmit = function() {
            const oldInput = document.getElementById('maintenanceCombinedImages');
            if (oldInput) oldInput.remove();
            this.querySelectorAll('input[name="giai_doan_anh_list"]').forEach(el => el.remove());

            const dt = new DataTransfer();
            maintenanceNewImages.forEach(item => dt.items.add(item.file));
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.id = 'maintenanceCombinedImages';
            fileInput.name = 'hinh_anh';
            fileInput.multiple = true;
            fileInput.hidden = true;
            fileInput.files = dt.files;
            this.appendChild(fileInput);

            const stageInput = document.createElement('input');
            stageInput.type = 'hidden';
            stageInput.name = 'giai_doan_anh_list';
            stageInput.value = JSON.stringify(maintenanceNewImages.map(item => item.stage));
            this.appendChild(stageInput);
        };
    }
}

initMaintenanceFormBindings();
</script>
